name: Mesure de fiabilité

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Nombre d'actions testées (les plus liquides ; 0 = toutes)"
        default: "80"
      scales:
        description: "Facteurs de volatilité à comparer, séparés par des virgules (1 = actuel)"
        default: "0.6,0.75,0.9"
      auto:
        description: "Ajouter toutes les actions de Paris listées par Yahoo (oui/non)"
        default: "non"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        scale: ${{ fromJSON(format('[{0}]', inputs.scales)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rejouer le passé
        run: |
          AUTO=""
          if [ "${{ inputs.auto }}" = "oui" ]; then AUTO="--auto"; fi
          python backtest.py --tickers "${{ inputs.tickers }}" --sigma-scale "${{ matrix.scale }}" $AUTO --out backtest_report.md
      - name: Afficher le rapport sur la page de l'exécution
        if: always()
        run: |
          if [ -f backtest_report.md ]; then cat backtest_report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-fiabilite-${{ matrix.scale }}
          path: backtest_report.md
