name: Mesure de fiabilité

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Nombre d'actions testées (les plus liquides)"
        default: "80"

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rejouer le passé
        run: python backtest.py --tickers "${{ inputs.tickers }}" --out backtest_report.md
      - name: Afficher le rapport sur la page de l'exécution
        if: always()
        run: |
          if [ -f backtest_report.md ]; then cat backtest_report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-fiabilite
          path: backtest_report.md
