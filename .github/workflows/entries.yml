name: Déclencheurs d'entrée (S hebdo + Donchian-2)

on:
  workflow_dispatch:
    inputs:
      fee:
        description: "Frais par ordre en % (0,398 = ordre de 500 € à 1,99 €)"
        default: "0.398"

permissions:
  contents: read

jobs:
  entries:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Comparer les déclencheurs d'entrée
        run: python entries.py --fee "${{ inputs.fee }}" --out entries_report.md
      - name: Afficher le rapport sur la page de l'exécution
        if: always()
        run: |
          if [ -f entries_report.md ]; then cat entries_report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entries
          path: |
            entries_report.md
            entries_trades.csv
