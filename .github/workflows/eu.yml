name: S hebdo sur d'autres places européennes

on:
  workflow_dispatch:
    inputs:
      fee:
        description: "Frais par ordre en % (0,398 = ordre de 500 € à 1,99 €)"
        default: "0.398"

permissions:
  contents: read

jobs:
  eu:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tester S hebdo hors de Paris
        run: python eu.py --fee "${{ inputs.fee }}" --out eu_report.md
      - name: Afficher le rapport sur la page de l'exécution
        if: always()
        run: |
          if [ -f eu_report.md ]; then cat eu_report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eu
          path: |
            eu_report.md
            eu_trades.csv
