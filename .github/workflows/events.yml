name: Chocs d'information (dérive et rebond)

on:
  workflow_dispatch:
    inputs:
      fee:
        description: "Frais par ordre en % (0,398 = ordre de 500 € à 1,99 €)"
        default: "0.398"

permissions:
  contents: read

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tester les chocs d'information
        run: python events.py --fee "${{ inputs.fee }}" --out events_report.md
      - name: Afficher le rapport sur la page de l'exécution
        if: always()
        run: |
          if [ -f events_report.md ]; then cat events_report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: events
          path: |
            events_report.md
            events_trades.csv
