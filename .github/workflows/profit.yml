name: Étude du profit

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Nombre d'actions (les plus liquides ; 0 = toutes les actions françaises de l'univers)"
        default: "0"
      fee:
        description: "Frais par ordre en % (0,398 = PEA Boursorama Découverte, ordre de 500 € : 1,99 € ; au-delà de 500 € : 0,5 %)"
        default: "0.398"

permissions:
  contents: read

jobs:
  profit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rejouer le passé et mesurer le profit
        run: python profit.py --tickers "${{ inputs.tickers }}" --fee "${{ inputs.fee }}" --out profit_report.md
      - name: Afficher le rapport sur la page de l'exécution
        if: always()
        run: |
          if [ -f profit_report.md ]; then cat profit_report.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etude-profit
          path: |
            profit_report.md
            profit_fa_trades.csv
            profit_s_trades.csv
