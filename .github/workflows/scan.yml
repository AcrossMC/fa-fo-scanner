name: Scan Fa/Fo

on:
  schedule:
    # Toutes les 15 min de 7h à 16h45 UTC (= séance de Paris en heure d'été comme d'hiver), du lundi au vendredi
    - cron: "*/15 7-16 * * 1-5"
    # Passage supplémentaire après la clôture (17h55 Paris) pour valider les bougies jour / semaine / mois
    - cron: "55 15,16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Scanner et notifier
        run: python scanner.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HOLDINGS: ${{ vars.HOLDINGS }}

      - name: Publier les données
        run: |
          git config user.name "fa-scanner"
          git config user.email "fa-scanner@users.noreply.github.com"
          mkdir -p /tmp/out
          cp docs/data.json /tmp/out/data.json
          if [ -f state.json ]; then cp state.json /tmp/out/state.json; fi
          for i in 1 2 3; do
            git fetch -q origin main
            git reset -q --hard origin/main          # repart de la version en ligne : aucun conflit possible
            cp /tmp/out/data.json docs/data.json
            if [ -f /tmp/out/state.json ]; then cp /tmp/out/state.json state.json; fi
            git add docs/data.json
            if [ -f state.json ]; then git add state.json; fi
            if git diff --cached --quiet; then break; fi
            git commit -q -m "scan $(date -u +%Y-%m-%d_%H:%M)"
            if git push -q; then break; fi
            sleep 5
          done
